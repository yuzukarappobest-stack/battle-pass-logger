<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Battle Pass Logger</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="title-block">
        <h1>Battle Pass Logger</h1>
        <p id="statusText">接続状態: 未接続</p>
      </div>
      <div class="header-actions" aria-label="操作">
        <button id="connectButton" type="button" class="primary">接続</button>
        <button id="disconnectButton" type="button">切断</button>
        <button id="clearButton" type="button">クリア</button>
        <button id="csvButton" type="button">CSV保存</button>
      </div>
    </header>

    <section class="settings" aria-label="接続設定">
      <label>
        Service UUID
        <input id="serviceUuid" value="55c40000-f8eb-11ec-b939-0242ac120002" autocomplete="off" spellcheck="false" />
      </label>
      <label>
        Notify UUID
        <input id="notifyUuid" value="55c4f002-f8eb-11ec-b939-0242ac120002" autocomplete="off" spellcheck="false" />
      </label>
      <label class="check-field">
        <input id="pairingHint" type="checkbox" checked />
        BEYBLADEで始まる機器を優先
      </label>
    </section>

    <main class="dashboard">
      <section class="panel device-panel">
        <h2>デバイス</h2>
        <div class="device-summary">
          <div>
            <span class="label">名前</span>
            <strong id="deviceName">-</strong>
          </div>
          <div>
            <span class="label">状態</span>
            <strong id="connectionState">未接続</strong>
          </div>
        </div>
        <label class="launcher-field">
          ランチャー
          <select id="launcherSelect">
            <option value="winder" selected>ワインダー</option>
            <option value="string">ストリング</option>
          </select>
        </label>
        <p class="hint">
          Battle Pass をセットしてから接続し、シュートすると通知データを記録します。次のシュート開始やベイセット通知で前回結果を保存します。
        </p>
      </section>

      <section class="panel score-panel">
        <div class="score">
          <span>シュートパワー</span>
          <strong id="shootPower">-</strong>
        </div>
        <div class="score">
          <span>推定実回転数</span>
          <strong id="realRpm">-</strong>
        </div>
      </section>

      <section class="panel results-panel">
        <h2>結果一覧</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>時刻</th>
                <th>ランチャー</th>
                <th>SP</th>
                <th>実回転数</th>
              </tr>
            </thead>
            <tbody id="resultRows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel power-panel">
        <h2>シュートパワーデータ</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>回転</th>
                <th>推定SP</th>
              </tr>
            </thead>
            <tbody id="powerRows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel distribution-panel">
        <div class="distribution-card">
          <h2>実回転数分布 ワインダー</h2>
          <canvas id="winderDistribution"></canvas>
        </div>
        <div class="distribution-card">
          <h2>実回転数分布 ストリング</h2>
          <canvas id="stringDistribution"></canvas>
        </div>
      </section>

      <section class="panel graph-panel">
        <h2>1-20回転目グラフ</h2>
        <canvas id="powerGraph"></canvas>
      </section>

      <section class="panel log-panel">
        <h2>受信データ</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>時刻</th>
                <th>種別</th>
                <th>HEX</th>
                <th>推定デコード</th>
              </tr>
            </thead>
            <tbody id="logRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
